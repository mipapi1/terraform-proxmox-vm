name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate module
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate examples (against this checkout)
        run: |
          for d in examples/*/; do
            sed -i 's#source *= *"github.com/mipapi1/terraform-proxmox-vm?ref=[^"]*"#source = "../.."#' "$d/main.tf"
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
